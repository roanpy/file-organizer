name: Build Multi-Platform

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows only after target-system validation'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows == true
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          
      - name: Build Windows App
        run: |
          pyinstaller SoftwareOrganizer.windows.spec
            
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileOrganizer-Windows
          path: dist/FileOrganizer/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          
      - name: Build macOS App
        run: |
          pyinstaller SoftwareOrganizer.spec
            
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileOrganizer-macOS
          path: dist/FileOrganizer.app/
          retention-days: 30
