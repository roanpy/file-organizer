name: Build Multi-Platform

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows only after target-system validation'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows == true
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          
      - name: Build Windows App
        run: |
          pyinstaller SoftwareOrganizer.windows.spec
            
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-Windows
          path: dist/FileOrganizer/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          
      - name: Build macOS App
        run: |
          pyinstaller SoftwareOrganizer.spec
            
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-macOS
          path: dist/FileOrganizer.app/
          retention-days: 30
