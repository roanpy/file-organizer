name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Lint Python sources
        run: python -m ruff check src tests scripts SoftwareOrganizer-Skill

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src SoftwareOrganizer-Skill tests

      - name: Check frontend syntax
        run: node --check static/app.js

      - name: Check frontend localization syntax
        run: node --check static/i18n.js

      - name: Check public safety
        run: python scripts/check_public_safety.py

      - name: Check installed dependencies
        run: python -m pip check
